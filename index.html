let rows=[];
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function init(){
 $("country").innerHTML='<option value="">اختر الدولة</option>'+Object.entries(geo).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join("");
 $("activity").innerHTML='<option value="">اختر النشاط</option>'+acts.map(a=>`<option value="${a[1]}">${a[0]}</option>`).join("");
 $("country").onchange=regions; regions();
}
function regions(){const g=geo[$("country").value];$("region").innerHTML='<option value="">كل المحافظات / الولايات</option>'+((g?.r||[]).map(x=>`<option>${x}</option>`).join(""))}
function render(){ $("count").textContent="النتائج: "+rows.length;$("body").innerHTML=rows.map(r=>`<tr><td>${esc(r.country)}</td><td>${esc(r.region)}</td><td>${esc(r.name)}</td><td>${esc(r.activity)}</td><td>${esc(r.email)}</td><td>${esc(r.phone)}</td><td>${esc(r.mobile)}</td><td>${r.website?`<a target="_blank" href="${esc(r.website)}">فتح</a>`:""}</td></tr>`).join("")}
async function search(){
 if(API_BASE.includes("PUT_YOUR")){alert("ضع رابط Backend في API_BASE أولاً");return}
 const cc=$("country").value,activity=$("activity").value;if(!cc||!activity){alert("اختر الدولة والنشاط");return}
 $("status").textContent="جارٍ الاتصال بمحرك البحث...";
 const p=new URLSearchParams({country:cc,countryName:geo[cc].n,region:$("region").value,activity,keyword:$("keyword").value});
 try{const r=await fetch(API_BASE+"/api/search?"+p);const d=await r.json();if(!r.ok)throw Error(d.error||("HTTP "+r.status));rows=d.results||[];render();$("status").textContent=(d.message||`اكتمل البحث: ${rows.length} نتيجة.`)+`${d.cached?" (من الذاكرة المؤقتة)":""}`+(d.warnings?.length?" بعض المصادر لم تستجب وتم الاحتفاظ بالنتائج المتاحة.":"")}
 catch(e){$("status").textContent="تعذر الاتصال بالـ API: "+e.message}
}
function clearRows(){rows=[];render();$("status").textContent="تم مسح النتائج."}
function exportCSV(){if(!rows.length){alert("لا توجد بيانات");return}const h=["الدولة","المحافظة","اسم الشركة","النشاط","الإيميل","التليفون","الموبايل","الموقع"],q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',csv="\uFEFF"+[h,...rows.map(r=>[r.country,r.region,r.name,r.activity,r.email,r.phone,r.mobile,r.website])].map(x=>x.map(q).join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="SWP_Business_Data.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
